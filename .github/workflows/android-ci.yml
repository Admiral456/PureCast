name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build debug and optimized release APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Report APK sizes
        run: |
          stat --printf="Debug APK: %s bytes\\n" app/build/outputs/apk/debug/app-debug.apk
          stat --printf="Release APK: %s bytes\\n" app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PureCast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v7
        with:
          name: PureCast-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
