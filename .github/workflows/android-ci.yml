name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests and build all installable APK variants
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleUnminified

      - name: Verify optimized and full release packages
        run: |
          python scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk
          python scripts/verify_apk.py app/build/outputs/apk/unminified/app-unminified.apk

      - name: Prepare one user-facing PureCast APK
        run: |
          cp app/build/outputs/apk/unminified/app-unminified.apk app/build/outputs/apk/PureCast.apk
          python scripts/verify_apk.py app/build/outputs/apk/PureCast.apk
          sha256sum app/build/outputs/apk/PureCast.apk | tee app/build/outputs/apk/PureCast.apk.sha256

      - name: Report internal APK size comparison
        run: |
          DEBUG_SIZE=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          OPTIMIZED_SIZE=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          FULL_SIZE=$(stat -c %s app/build/outputs/apk/PureCast.apk)
          {
            echo "## PureCast 0.9.0 package verification"
            echo ""
            echo "| Build | Size |"
            echo "|---|---:|"
            echo "| Debug (internal only) | $DEBUG_SIZE bytes |"
            echo "| R8 optimized (internal comparison) | $OPTIMIZED_SIZE bytes |"
            echo "| **PureCast.apk (only published APK)** | **$FULL_SIZE bytes** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one standalone PureCast APK
        uses: actions/upload-artifact@v7
        with:
          name: PureCast-Android
          path: app/build/outputs/apk/PureCast.apk
          if-no-files-found: error
